# Started at the end of boot. Everything that should run is reachable from here.
#
# `after` is declared as well as `requires`: without it the target is a label
# on a set, not a milestone, and would be reached before its units start.
[target]

[unit]
description = "Default target"
requires    = ["console"]
wants       = [
    "banner",
    "oxlogd",
    "chatty",
    "logged",
    "ticker",
    "tick-timer",
    "nightly",
    "slow",
    "patient",
    "broken",
    "needy",
    "alpha",
    "switch",
    "flaky",
    "signalled",
    "hangs-back",
    "specifiers",
    "muted",
    "reloader",
    "quiet",
    "probe",
    "hangs",
    "limited",
    "forking",
    "dropped",
    "stubborn",
    "echo-socket",
    "echo-tcp",
    "poke",
    "knock-socket",
    "knocker",
    "absent",
]
after       = ["console", "banner", "logged"]
