# Cut by pushing a tag:
#
#   git tag -a v0.1.0 -m "…" && git push origin v0.1.0
#
# Nothing here runs on its own. A version number is a claim about stability,
# and the person making that claim should be the one typing it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for a dry run against an existing tag"
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.arch }} binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.arch }}-unknown-linux-musl \
            -p oxinit -p oxctl -p oxlogd

      # Statically linked, so the tarball is the whole dependency: an init
      # system that needed a loader from the filesystem it is about to mount
      # would be a poor one.
      - name: Pack
        run: |
          DIR=oxinit-${{ github.ref_name }}-${{ matrix.arch }}-linux-musl
          mkdir -p "$DIR"
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/{oxinit,oxctl,oxlogd} "$DIR/"
          cp README.md LICENSE-MIT LICENSE-APACHE docs/UNIT_FORMAT.md "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
          file "$DIR/oxinit"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  image:
    name: demo image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cpio

      - name: Cache the boot artifacts
        uses: actions/cache@v4
        with:
          path: target/busybox-x86_64
          key: alpine-v3.22-x86_64-shell

      - run: cargo xtask fetch --arch x86_64

      # The image the README's first section tells people to run. Built from
      # demo/, not units/ — the latter is the test suite and contains services
      # that fail on purpose.
      - name: Build the demo image
        run: cargo xtask demo --build-only

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Only the versioned tag. `:demo` tracks `main` and is published by CI,
      # because it is documentation rather than a release artifact — the README
      # points at it, and a README should not be waiting on a version number
      # somebody has not decided to declare yet.
      - name: Push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag oxinit:demo "ghcr.io/$OWNER/oxinit:${{ github.ref_name }}"
          docker push "ghcr.io/$OWNER/oxinit:${{ github.ref_name }}"

  release:
    name: publish
    runs-on: ubuntu-latest
    needs: [binaries, image]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # `--generate-notes` writes the pull requests merged since the previous
      # tag. The milestone titles are the changelog, which is the reason PR
      # titles in this repository are written as sentences.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > header.md <<'EOF'
          **Pre-alpha.** Nothing is stable, and the unit format may change
          between any two releases.

          ### Try it

          ```bash
          docker run --rm --name oxinit-demo -p 8080:8080 ghcr.io/OWNER/oxinit:TAG
          ```

          `ghcr.io/OWNER/oxinit:demo` tracks `main` if you would rather have the
          latest.

          ```bash
          ```

          ### Install

          Download the tarball for your architecture below, check it, and put
          the binaries somewhere on the target system. They are statically
          linked against musl and need nothing else.

          ```bash
          sha256sum -c oxinit-TAG-x86_64-linux-musl.tar.gz.sha256
          tar xzf oxinit-TAG-x86_64-linux-musl.tar.gz
          ```

          `oxinit` is the supervisor and belongs at `/sbin/init`; `oxctl` is
          the client and `oxlogd` the log writer. Units go in
          `/etc/oxinit/units/`, and every key is specified in
          [docs/UNIT_FORMAT.md](docs/UNIT_FORMAT.md).

          Verified on x86_64 and aarch64, under QEMU, in a container, and
          against a real Alpine userspace. See [ROADMAP.md](ROADMAP.md) for
          what each milestone was checked against.

          ---
          EOF

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed -i "s|OWNER|$OWNER|g; s|TAG|${{ github.ref_name }}|g" header.md

          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file header.md \
            --generate-notes \
            --prerelease \
            *.tar.gz *.tar.gz.sha256
