# Every guarantee in ROADMAP.md was, until this file existed, a claim about
# something someone had run once on their own machine. This runs them.
#
# Split by cost. `check` is seconds and gates everything; the boot suites are
# minutes each and run in parallel with one another. aarch64 has no hardware
# acceleration on an x86_64 runner, so its boot goes through QEMU's JIT and is
# the slowest thing here by a wide margin.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first. Nothing here is worth finishing for a
# commit that is already history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failed build should not also cost a stack trace nobody reads.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the musl targets
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # Both targets. The oxinit crate refuses to compile off Linux, and a
      # lint that only ever ran against one architecture is a lint that has
      # not run against the other.
      - run: cargo clippy --target x86_64-unknown-linux-musl --workspace --all-targets -- -D warnings
      - run: cargo clippy --target aarch64-unknown-linux-musl --workspace --all-targets -- -D warnings

      # The library crates have no OS dependency and run on the host. The
      # parser, the graph, the restart policy, the log format and the calendar
      # arithmetic are where the logic errors are.
      # `test-demo` builds the image locally and checks it, which is what let
      # the README ship a `docker run ghcr.io/...` line pointing at something
      # that had never been published: the test and the README were talking
      # about different images. This checks they agree on the name, which is
      # the half a test on a locally-built image structurally cannot.
      - name: The README's image reference is the one CI publishes
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          WANT="ghcr.io/$OWNER/oxinit:demo"
          if ! grep -qF "$WANT" README.md; then
            echo "README.md does not mention $WANT, which is what CI pushes"
            exit 1
          fi
          if ! grep -qF 'oxinit:demo' .github/workflows/ci.yml; then
            echo "the publish step no longer pushes the tag the README names"
            exit 1
          fi
          echo "README and CI agree on $WANT"

      # The v0.1.0 notes shipped with an empty ```bash block, from editing the
      # heredoc by string substitution and never rendering the result.
      # Markdown has no compiler; this is the compiler.
      - name: The release notes would render
        run: python3 .github/scripts/check-release-notes.py

      - name: Host tests
        run: cargo test -p oxinit-unit -p oxinit-graph -p oxinit-service -p oxinit-cgroup -p oxinit-user -p oxinit-ipc -p oxinit-log -p oxinit-timer

  msrv:
    name: builds on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-version` in Cargo.toml is a promise to anyone on an older
      # toolchain, and CI otherwise runs whatever `stable` is that week — so
      # the promise was never checked. A dependency bump or a language feature
      # raising the real floor would go unnoticed until someone on the
      # declared minimum tried to build.
      - name: Install the declared minimum
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "MSRV is $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          rustup target add x86_64-unknown-linux-musl --toolchain "$MSRV"
          echo "MSRV=$MSRV" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      # `rustup run` rather than `cargo +TOOLCHAIN`: the latter needs cargo to
      # be rustup's shim, and it is not on every developer's machine.
      - run: rustup run "$MSRV" cargo check --workspace --all-targets --target x86_64-unknown-linux-musl

  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # CLAUDE.md: "The dependency tree of PID 1 is part of its attack
      # surface." Seven direct dependencies, each justified in the commit that
      # added it — and nothing was watching them for advisories afterwards.
      #
      # Blocking on purpose. An advisory published against something inside
      # PID 1 is not a warning to look at later.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  boot:
    name: boot (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.arch }}-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: QEMU and cpio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm cpio

      # Keyed on the Alpine release the fetch is pinned to, so a bump
      # invalidates it and nothing else does.
      - name: Cache the boot artifacts
        uses: actions/cache@v4
        with:
          path: |
            target/vmlinuz-${{ matrix.arch }}
            target/busybox-${{ matrix.arch }}
          key: alpine-v3.22-${{ matrix.arch }}

      - run: cargo xtask fetch --arch ${{ matrix.arch }}

      - run: cargo xtask test-boot --arch ${{ matrix.arch }}

      # The log is the whole evidence, and a failure that only says which
      # needle was missing is a failure you have to reproduce locally to read.
      - name: The serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.arch }}
          path: target/test-boot-${{ matrix.arch }}.log
          if-no-files-found: ignore

  container:
    name: container
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cpio

      - name: Cache the boot artifacts
        uses: actions/cache@v4
        with:
          path: target/busybox-x86_64
          key: alpine-v3.22-x86_64-shell

      - run: cargo xtask fetch --arch x86_64

      # Docker is already on the runner, which is the only thing this needs
      # beyond the build.
      - run: cargo xtask container

  demo:
    name: the README's demo
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cpio

      - name: Cache the boot artifacts
        uses: actions/cache@v4
        with:
          path: target/busybox-x86_64
          key: alpine-v3.22-x86_64-shell

      - run: cargo xtask fetch --arch x86_64

      # Every command the README's opening section tells a newcomer to type.
      # The demo is the first thing anybody sees, so it is the worst thing to
      # let rot — and M13 already found what happens to an artifact nothing
      # runs. A README that tells someone to type something that no longer
      # works is worse than a README with nothing in it.
      - run: cargo xtask test-demo

      # The demo image is documentation, not a release artifact, so it is
      # published from `main` rather than from a tag. Tying it to a release
      # meant the README told people to pull something that would not exist
      # until a version number had been declared — which is a separate
      # decision, and was not going to be made that week.
      - name: Publish the demo image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag oxinit:demo "ghcr.io/$OWNER/oxinit:demo"
          docker push "ghcr.io/$OWNER/oxinit:demo"

  distro:
    name: a real userspace
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - name: QEMU and cpio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 cpio

      - name: Cache the boot artifacts
        uses: actions/cache@v4
        with:
          path: target/vmlinuz-x86_64
          key: alpine-v3.22-x86_64-kernel

      - run: cargo xtask fetch --arch x86_64

      - run: cargo xtask test-distro

      - name: The serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-distro
          path: target/test-distro-x86_64.log
          if-no-files-found: ignore
