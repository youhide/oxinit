[alias]
xtask = "run --package xtask --"

# Link with rust-lld rather than the host `cc`.
#
# Required when cross-compiling from macOS, where the system linker cannot
# produce Linux ELF ("ld: unknown options: --as-needed -Bstatic ..."). rust-lld
# ships with every rustup toolchain, including on Linux, so this is one linker
# on every host instead of a host-conditional setup.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
