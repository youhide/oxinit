[package]
name = "notify-probe"
version = "0.0.0"
description = "Test fixture: a service that speaks sd_notify"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A test fixture, not PID 1. The rules on the oxinit crate do not apply.
#
# libc is here for one call: `signal(SIGTERM, SIG_IGN)`, so the fixture can
# play a service that refuses to stop and make oxinit escalate to cgroup.kill.
# std has no way to ignore a signal.
[dependencies]
libc.workspace = true
