[package]
name = "oxinit-ipc"
version.workspace = true
description = "Control protocol types, shared by oxinit and oxctl"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Shared by both sides of the socket, so neither can drift from the other:
# the wire format is a type, not a convention written down twice.
#
# No Linux dependencies. The encoding is where a protocol bug would hide, and
# it is tested on the host.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
